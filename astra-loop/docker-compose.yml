# Drop-in stack for Astra Loop (Postgres) — equivalent to mattermost-team-edition + db.
# If containers cannot reach each other on the Docker bridge, use docker-compose.host.yml.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mostest
      POSTGRES_DB: mattermost
    volumes:
      - astra_loop_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 5s
      timeout: 5s
      retries: 20

  astra-loop:
    image: astra-loop:dev
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mostest@postgres:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_TEAMSETTINGS_SITENAME: Astra Loop
      MM_SERVICESETTINGS_SITEURL: http://localhost:8065
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_LOGSETTINGS_CONSOLELEVEL: INFO
    volumes:
      - astra_loop_data:/mattermost/data
      - astra_loop_config:/mattermost/config
      - astra_loop_logs:/mattermost/logs

volumes:
  astra_loop_pg:
  astra_loop_data:
  astra_loop_config:
  astra_loop_logs:
